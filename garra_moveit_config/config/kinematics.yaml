# O braco e planar: tres eixos paralelos. A IK resolve a pose completa, com alvo em X, Z e
# inclinacao da garra; Y e as outras rotacoes sao fixos pela geometria.
garra:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
