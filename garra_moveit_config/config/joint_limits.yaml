# joint_limits.yaml

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# max_velocity = velocidade do firmware (15 us a cada 20 ms = 750 us/s) / us_por_rad medido de cada junta
# (calibracao_servos.yaml): J1 750/636.2 = 1.18, J2 750/646.8 = 1.16, J3 750/713.2 = 1.05 rad/s.
# Acima disso o servo fica atrasado em relacao ao que o ROS acha (os servos nao informam a posicao).
joint_limits:
  Revolucionar_46:
    has_velocity_limits: true
    max_velocity: 1.17
    has_acceleration_limits: true
    max_acceleration: 3.0

  Revolucionar_49:
    has_velocity_limits: true
    max_velocity: 1.15
    has_acceleration_limits: true
    max_acceleration: 3.0

  Revolucionar_72:
    has_velocity_limits: true
    max_velocity: 1.05
    has_acceleration_limits: true
    max_acceleration: 3.0

  dedos:
    has_velocity_limits: true
    max_velocity: 1.26
    has_acceleration_limits: true
    max_acceleration: 3.0